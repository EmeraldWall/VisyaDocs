name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the English OCR language (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR~~~en-US*'
          if ($cap -and $cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
          Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*' | Format-Table Name, State

      - name: Core tests
        run: dotnet test tests/VisaryPDF.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Windows platform tests (OCR, imaging)
        run: dotnet test tests/VisaryPDF.Platform.Tests -c Release --logger "console;verbosity=normal"

  app:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Debug)
        run: dotnet build src/VisaryPDF.App -c Debug -p:Platform=${{ matrix.platform }}

      - name: Publish (Release, Native AOT, self contained)
        run: dotnet publish src/VisaryPDF.App -c Release -p:Platform=${{ matrix.platform }} -p:PublishProfile=win-${{ matrix.platform }}

      - name: Report size
        shell: pwsh
        run: |
          $rid = if ('${{ matrix.platform }}' -eq 'x64') { 'win-x64' } else { 'win-arm64' }
          $dir = "artifacts/VisaryPDF-$rid"
          $files = Get-ChildItem $dir -Recurse -File
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "Published folder: $mb MB in $($files.Count) files" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $files | Sort-Object Length -Descending | Select-Object -First 12 Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table

      - name: Memory check (open a PDF and scroll through it)
        if: matrix.platform == 'x64'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --quiet reportlab
          python build/make_sample_pdf.py "$PWD/sample.pdf" 80
          $env:VISARYPDF_MEMTEST = "$PWD/memory.txt"
          $app = Start-Process artifacts/VisaryPDF-win-x64/VisaryPDF.exe -ArgumentList "`"$PWD/sample.pdf`"" -PassThru
          if (-not $app.WaitForExit(240000)) { $app.Kill(); "Memory check timed out" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          if (Test-Path memory.txt) {
            "Memory check (80 page PDF):" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content memory.txt | ForEach-Object { "- $_" } | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VisaryPDF-${{ matrix.platform }}
          path: artifacts/VisaryPDF-win-*/
          if-no-files-found: error

  msix:
    # Builds the same MSIX that Visual Studio's "Create App Packages" makes, signs it with a throwaway
    # test certificate, installs it on the runner and starts it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check manifest images (sizes Visual Studio's manifest designer requires)
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python build/check_assets.py

      - name: Test certificate (subject matches the manifest publisher)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=VisaryPDF" -KeyUsage DigitalSignature `
            -FriendlyName "VisaryPDF test" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "ci-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$PWD/test.pfx" -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath "$PWD/VisaryPDF-test.cer" | Out-Null

      - name: Build MSIX (x64, Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/VisaryPDF.App -c Release -p:Platform=x64 -p:PublishProfile=msix-x64 `
            -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$PWD/test.pfx" -p:PackageCertificatePassword=ci-test `
            -p:AppxPackageDir="$PWD/packages/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # With images for several display scales the output is a bundle (app + per scale resources).
          $msix = Get-ChildItem packages -Recurse -Include *.msixbundle, *.msix | Sort-Object { $_.Extension -ne '.msixbundle' } | Select-Object -First 1
          if (-not $msix) { Write-Error "No .msix or .msixbundle was produced"; exit 1 }
          "MSIX: $($msix.Name), $([math]::Round($msix.Length / 1MB, 1)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "MSIX_PATH=$($msix.FullName)" >> $env:GITHUB_ENV

      - name: Install and start the package
        shell: pwsh
        run: |
          Import-Certificate -FilePath VisaryPDF-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $env:MSIX_PATH
          $package = Get-AppxPackage -Name VisaryPDF
          "Installed $($package.PackageFullName)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!App"
          Start-Sleep -Seconds 10
          $running = Get-Process -Name VisaryPDF -ErrorAction SilentlyContinue
          if (-not $running) { Write-Error "The installed app did not start"; exit 1 }
          "Started: working set $([math]::Round($running[0].WorkingSet64 / 1MB)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $running | Stop-Process -Force
          Remove-AppxPackage -Package $package.PackageFullName

      - uses: actions/upload-artifact@v4
        with:
          name: VisaryPDF-x64-msix-test
          path: |
            packages/**/*.msix
            packages/**/*.msixbundle
            VisaryPDF-test.cer
          if-no-files-found: error
